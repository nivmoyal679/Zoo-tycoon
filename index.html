<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Zoo Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Top status bar -->
    <header id="topbar">
      <div class="stat" id="stat-cash">
        <span class="stat-icon cash">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.8-1.5-1.3-2.8-1.3-1.7 0-2.8.9-2.8 2.1 0 2.9 5.8 1.4 5.8 4.2 0 1.2-1.2 2.1-3 2.1-1.4 0-2.5-.6-3-1.5M12 6.5v1.4M12 16.3v1.2"/></svg>
        </span>
        <div class="stat-text">
          <span class="stat-label">Funds</span>
          <span class="stat-value" id="cash-value">$10,000</span>
        </div>
      </div>

      <div class="brand">Zoo Tycoon</div>

      <div class="stat" id="stat-date">
        <div class="stat-text right">
          <span class="stat-label">Date</span>
          <span class="stat-value" id="date-value">Jan 1, 2000</span>
        </div>
        <span class="stat-icon date">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        </span>
      </div>
    </header>

    <!-- Map -->
    <main id="viewport">
      <canvas id="game"></canvas>

      <div id="hint" hidden>
        <span id="hint-text"></span>
        <button id="hint-cancel" class="icon-btn" aria-label="Cancel tool">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <nav id="side-panel" aria-label="View controls">
        <button class="fab" id="zoom-in" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="fab" id="zoom-out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button class="fab" id="zoom-reset" aria-label="Recenter map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
        <button class="fab on" id="grid-toggle" aria-label="Toggle grid" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M7.5 5.5l9 5M16.5 5.5l-9 5"/><path d="M3 13l9 5 9-5"/></svg>
        </button>
      </nav>

      <div id="tile-info" class="card" hidden><div id="tile-info-text"></div></div>
      <div id="loading"><div class="spinner"></div></div>
    </main>

    <!-- Construction toolbar -->
    <footer id="toolbar">
      <div id="tray"><div id="tray-items"></div></div>
      <div id="tabs" role="tablist">
        <button class="tab" data-tab="terrain" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l6-9 4 6 3-4 5 7z"/><circle cx="17" cy="6" r="2"/></svg>
          <span>Terrain</span>
        </button>
        <button class="tab" data-tab="fences" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V6l2-2 2 2v14M15 20V6l2-2 2 2v14M3 10h18M3 15h18"/></svg>
          <span>Fences</span>
        </button>
        <button class="tab" data-tab="animals" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="9" r="2"/><circle cx="10" cy="5.5" r="2"/><circle cx="14" cy="5.5" r="2"/><circle cx="18" cy="9" r="2"/><path d="M8 17.5c0-2.8 1.8-5.5 4-5.5s4 2.7 4 5.5c0 1.6-1.3 2.5-4 2.5s-4-.9-4-2.5z"/></svg>
          <span>Animals</span>
        </button>
        <button class="tab" data-tab="staff" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7.5" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 4.3a3.5 3.5 0 010 6.4M18 13.8c2 .9 3.5 3.1 3.5 5.7"/></svg>
          <span>Staff</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="terrain.js"></script>
  <script src="sprites.js"></script>
  <script src="main.js"></script>
</body>
</html>
