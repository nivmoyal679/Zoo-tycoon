<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1d0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Retro Zoo Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Retro status bar -->
    <header id="status-bar">
      <div class="stat" id="stat-cash">
        <span class="stat-label">CASH</span>
        <span class="stat-value" id="cash-value">$10,000</span>
      </div>
      <div class="title">ZOO TYCOON</div>
      <div class="stat" id="stat-date">
        <span class="stat-label">DATE</span>
        <span class="stat-value" id="date-value">Jan 1, 2000</span>
      </div>
    </header>

    <!-- Game map -->
    <main id="viewport">
      <canvas id="game"></canvas>

      <div id="zoom-controls">
        <button class="btn" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
        <button class="btn" id="zoom-reset" aria-label="Reset view">&#8962;</button>
      </div>

      <div id="tile-info" hidden></div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
